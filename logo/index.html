<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  .tile{position:fixed;inset:0;display:grid;place-items:center;
    background:radial-gradient(700px 500px at 72% 22%,#ff7a45,transparent 60%),linear-gradient(135deg,#e8562a,#7a1f0d);
    font-family:"Space Grotesk",sans-serif}
  .mark{position:relative;display:flex;flex-direction:column;align-items:center;gap:34px}
  /* falcon in flight — two swept wings */
  svg{width:520px;height:360px;filter:drop-shadow(0 24px 60px rgba(0,0,0,.28))}
  .word{color:#fff;font-weight:700;font-size:66px;letter-spacing:.16em;text-transform:uppercase}
  .word b{opacity:.62;font-weight:700}
</style></head>
<body>
  <div class="tile"><div class="mark">
    <svg viewBox="0 0 260 180" fill="none">
      <path d="M130 40 C 96 74, 54 96, 8 100 C 60 108, 104 100, 130 74 C 156 100, 200 108, 252 100 C 206 96, 164 74, 130 40 Z" fill="#fff"/>
      <path d="M130 74 C 118 104, 108 132, 96 168 C 122 140, 130 112, 130 92 C 130 112, 138 140, 164 168 C 152 132, 142 104, 130 74 Z" fill="#fff"/>
    </svg>
    <div class="word">Falcon <b>Web</b></div>
  </div></div>
</body></html>
