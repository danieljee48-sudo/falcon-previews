<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falcon Web Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a121a;font-family:Inter,-apple-system,sans-serif;overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    background:radial-gradient(600px 500px at 80% -6%,rgba(232,86,42,.45),transparent 60%),linear-gradient(180deg,#0e1a26,#0a121a);
    padding:22px 16px 0}
  .hook{color:#fff;font-weight:800;font-size:clamp(24px,7vw,40px);line-height:1.12;text-align:center;letter-spacing:-.02em;
    max-width:16ch;margin:8px auto 14px;text-shadow:0 2px 18px rgba(0,0,0,.4);min-height:2.2em;
    opacity:0;transform:translateY(14px);animation:in .7s .2s forwards cubic-bezier(.16,.8,.3,1)}
  @keyframes in{to{opacity:1;transform:none}}
  .phone{position:relative;flex:1;width:100%;max-width:360px;margin:0 auto;
    border-radius:34px 34px 0 0;overflow:hidden;border:8px solid #1b2735;border-bottom:none;
    box-shadow:0 -10px 60px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.05)}
  .phone .track{position:absolute;top:0;left:0;width:100%;will-change:transform}
  .phone iframe{width:100%;border:0;display:block;background:#fff}
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:5;text-align:center;padding:16px 16px 26px;
    background:linear-gradient(0deg,#0a121a 55%,transparent);color:#fff}
  .cta .big{font-weight:700;font-size:clamp(17px,4.6vw,22px)}
  .cta .big b{color:#ff7a45}
  .cta .small{font-weight:600;font-size:14px;color:#c9d3dd;margin-top:4px}
  .cta .small b{color:#fff}
</style></head><body>
<div class="stage">
  <div class="hook" id="hook">Loading…</div>
  <div class="phone" id="phone"><div class="track" id="track"><iframe id="site" src="about:blank"></iframe></div></div>
</div>
<div class="cta">
  <div class="big">✨ Free mockup of <b>YOUR</b> website</div>
  <div class="small">👇 Link in bio · <b>@falcon.web.studio</b></div>
</div>
<script>
  var q=new URLSearchParams(location.search);
  var site=q.get('site')||'paws-and-whiskers-grooming';
  var hook=q.get('hook')||'Your business deserves a website this good';
  document.getElementById('hook').textContent=hook;
  var ifr=document.getElementById('site');
  ifr.src='/demo/'+site+'/';
  // Scroll duration in seconds — tune with ?dur=  (default 8s)
  var DUR=(parseFloat(q.get('dur'))||8)*1000;
  var track=document.getElementById('track'), phone=document.getElementById('phone');
  ifr.onload=function(){
    try{
      var doc=ifr.contentDocument;
      function fullHeight(){return Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);}
      function begin(){
        // Render the ENTIRE page (no internal scroll) then slide it up with a
        // CSS transform — GPU-smooth, constant speed, zoom-independent.
        var full=fullHeight();
        ifr.style.height=full+'px';
        var dist=Math.max(0, full - phone.clientHeight);
        function loop(){
          var start=null;
          function step(ts){
            if(!start)start=ts;
            var p=Math.min(1,(ts-start)/DUR); // linear
            track.style.transform='translate3d(0,'+(-dist*p)+'px,0)';
            if(p<1)requestAnimationFrame(step);
            else setTimeout(function(){track.style.transform='translate3d(0,0,0)';setTimeout(loop,1400);},2200);
          }
          requestAnimationFrame(step);
        }
        setTimeout(loop, 2600); // hold at top so the hook reads
      }
      setTimeout(begin, 600); // let fonts/images settle before measuring height
    }catch(e){}
  };
</script>
</body></html>
